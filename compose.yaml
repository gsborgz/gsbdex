services:
  redis:
    container_name: 'pokedex-redis'
    image: 'redis:6.2'
    ports:
      - '6380:6379'
  serverless-redis-http:
    container_name: 'pokedex-serverless-redis-http'
    image: 'hiett/serverless-redis-http:latest'
    ports:
      - '8079:80'
    environment:
      SRH_MODE: 'env'
      SRH_TOKEN: 'local_dev_token'
      SRH_CONNECTION_STRING: 'redis://redis:6379'
    depends_on:
      - redis
